# Her push ve pull request'te: tip denetimi, lint, birim testleri, biçim, arayüz testleri
# (Playwright, çalıştırıcıdaki Edge ile) ve Rust (biçim, clippy, testler).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm format:check
      # Tanıtım sahneleri .demo/preview.mp4 ister (git dışı): 640 sn'lik küçük deneme videosu.
      - name: Deneme videosu
        run: |
          choco install ffmpeg -y --no-progress
          New-Item -ItemType Directory -Force .demo | Out-Null
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=s=320x180:r=10:d=640 -f lavfi -i sine=f=440:d=640 -c:v libx264 -preset ultrafast -crf 40 -c:a aac -b:a 32k -shortest .demo/preview.mp4
      - run: pnpm test:e2e
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --lib --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test --lib
        working-directory: src-tauri
